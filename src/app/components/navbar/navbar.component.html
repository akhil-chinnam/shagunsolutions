<nav class="navbar" [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="nav-container">
    <!-- Logo -->
    <a class="logo" (click)="scrollTo('#home')">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="#D4870A" stroke-width="2"/>
          <path d="M12 20 C12 14, 20 10, 20 10 C20 10, 28 14, 28 20 C28 26, 20 30, 20 30 C20 30, 12 26, 12 20Z" fill="#D4870A" opacity="0.3"/>
          <path d="M16 20 C16 16.5, 20 14, 20 14 C20 14, 24 16.5, 24 20 C24 23.5, 20 26, 20 26 C20 26, 16 23.5, 16 20Z" fill="#D4870A"/>
          <circle cx="20" cy="20" r="3" fill="#FAF7F2"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">SHAGUN</span>
        <span class="logo-sub">SOFTWARE SOLUTIONS</span>
      </div>
    </a>

    <!-- Desktop Nav -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a (click)="scrollTo(link.href)">{{ link.label }}</a>
      </li>
    </ul>

    <!-- CTA -->
    <a class="nav-cta" (click)="scrollTo('#contact')">Get In Touch</a>

    <!-- Hamburger -->
    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <ul>
      <li *ngFor="let link of navLinks">
        <a (click)="scrollTo(link.href)">{{ link.label }}</a>
      </li>
      <li><a class="mobile-cta" (click)="scrollTo('#contact')">Get In Touch</a></li>
    </ul>
  </div>
</nav>

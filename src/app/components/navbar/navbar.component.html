<nav class="navbar" [class.scrolled]="scrolled" [class.menu-open]="menuOpen">
  <div class="nav-container">
    <!-- Logo -->
    <a class="logo" (click)="scrollTo('#home')">
      <div class="logo-icon">
        <img src="assets/images/shagun-logo.png" alt="Shagun Software Solutions logo">
      </div>
      <div class="logo-text">
        <span class="logo-name">SHAGUN</span>
        <span class="logo-sub">SOFTWARE SOLUTIONS</span>
      </div>
    </a>

    <!-- Desktop Nav -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a (click)="scrollTo(link.href)">{{ link.label }}</a>
      </li>
    </ul>

    <!-- CTA -->
    <a class="nav-cta" (click)="scrollTo('#contact')">Get In Touch</a>

    <!-- Hamburger -->
    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <ul>
      <li *ngFor="let link of navLinks">
        <a (click)="scrollTo(link.href)">{{ link.label }}</a>
      </li>
      <li><a class="mobile-cta" (click)="scrollTo('#contact')">Get In Touch</a></li>
    </ul>
  </div>
</nav>

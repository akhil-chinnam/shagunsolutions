<section id="contact" class="contact">
  <div class="contact-bg">
    <div class="contact-glow"></div>
  </div>

  <div class="container">
    <div class="contact-header">
      <span class="section-label reveal">Get In Touch</span>
      <h2 class="section-title light reveal reveal-delay-1">
        Let's Build a <span>Smarter Tomorrow</span>
      </h2>
      <p class="contact-subtitle reveal reveal-delay-2">
        Ready to transform your ideas into powerful digital solutions?
        We'd love to hear from you.
      </p>
    </div>

    <div class="contact-grid">
      <!-- Info Panel -->
      <div class="contact-info">
        <div class="info-item reveal" *ngFor="let c of contactInfo; let i = index" [class]="'reveal-delay-' + (i % 3 + 1)">
          <div class="info-icon">{{ c.icon }}</div>
          <div class="info-content">
            <span class="info-label">{{ c.label }}</span>
            <a [href]="c.link" class="info-value">{{ c.value }}</a>
          </div>
        </div>

        <!-- Social -->
        <div class="contact-social reveal reveal-delay-4">
          <span>Connect With Us</span>
          <div class="social-links">
            <a href="https://www.shagunsolutions.com" target="_blank" class="social-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
              </svg>
            </a>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrapper reveal reveal-delay-2">
        <form class="contact-form" (ngSubmit)="submitForm()" *ngIf="!submitted">
          <div class="form-row">
            <div class="form-group">
              <label>Your Name</label>
              <input type="text" [(ngModel)]="formData.name" name="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" [(ngModel)]="formData.email" name="email" placeholder="you@company.com" required>
            </div>
          </div>
          <div class="form-group">
            <label>Subject</label>
            <input type="text" [(ngModel)]="formData.subject" name="subject" placeholder="How can we help?" required>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea [(ngModel)]="formData.message" name="message" placeholder="Tell us about your project..." rows="5" required></textarea>
          </div>
          <button type="submit" class="btn-primary">
            <span>Send Message</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>

        <div class="form-success" *ngIf="submitted">
          <div class="success-icon">✅</div>
          <h3>Message Sent!</h3>
          <p>Thank you for reaching out. Our team will get back to you shortly.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="services" class="services">
  <div class="services-bg">
    <div class="bg-hex bg-hex-1"></div>
    <div class="bg-hex bg-hex-2"></div>
  </div>

  <div class="container">
    <div class="section-header">
      <span class="section-label reveal">What We Do</span>
      <h2 class="section-title light reveal reveal-delay-1">Our <span>Services</span></h2>
      <p class="section-desc reveal reveal-delay-2">
        Comprehensive technology solutions tailored to transform your business operations and digital presence.
      </p>
    </div>

    <div class="services-grid">
      <div class="service-card reveal" *ngFor="let s of services; let i = index" [class]="'reveal-delay-' + (i % 3 + 1)">
        <div class="service-number">0{{ i + 1 }}</div>
        <div class="service-icon" [innerHTML]="s.icon"></div>
        <h3 class="service-title">{{ s.title }}</h3>
        <p class="service-desc">{{ s.desc }}</p>
        <div class="service-arrow">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M4 10h12M12 6l4 4-4 4"/>
          </svg>
        </div>
        <div class="service-glow"></div>
      </div>
    </div>
  </div>
</section>
